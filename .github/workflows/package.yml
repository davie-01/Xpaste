name: Package
# 手动运行：打一个 ad-hoc 签名的试用包，作为构建产物上传（不发布）。
# 正式发布在本机用 Tools/release.sh 打包：发布包要用 Apple Development 证书签名（应用内更新后授权才不会失效），
# 证书和 Sparkle 的签名私钥都只在本机，所以这里不建 Release。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and package
        run: Tools/package.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: XPaste-arm64
          path: dist/*
          if-no-files-found: error
