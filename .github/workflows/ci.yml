name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # GitHub 带 Xcode 27 的构建机标签是 xcode-27（macOS 27，只有 Apple Silicon），没有叫 macos-27 的标签；
    # macos-26 上只有 Xcode 26，编不了部署目标为 macOS 27 的工程。
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Xcode version
        run: xcodebuild -version
      - name: Unit tests
        run: swift test --package-path Packages/XPasteKit
      - name: String and compliance checks
        run: |
          Tools/check-strings.sh
          Tools/check-compliance.sh
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app
        run: >
          xcodebuild -project XPaste.xcodeproj -scheme XPaste -configuration Debug
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO build
